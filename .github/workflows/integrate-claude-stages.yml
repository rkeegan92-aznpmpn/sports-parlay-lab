name: Integrate Claude Stage 1 and Stage 2
on:
  push:
    branches: [integrate-claude-stage1-stage2]
    paths:
      - '.github/workflows/integrate-claude-stages.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply patches in order
        run: |
          set -euo pipefail
          git apply --check stage1-sports-architecture.patch
          git apply stage1-sports-architecture.patch
          git apply --check stage2-presets-stake-migration.patch
          git apply stage2-presets-stake-migration.patch
      - name: Commit integrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl-parlay-lab
          git diff --cached --quiet || git commit -m "Integrate Claude Stage 1 and Stage 2 application source"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Build
        if: always()
        run: npm run build
